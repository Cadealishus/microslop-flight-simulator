[package]
name = "fablegame"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
crossbeam-channel = "0.5.17"
earcutr = "0.5.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false }
ab_glyph = "0.2.32"
flate2 = "1.1.11"
gilrs = "0.11.2"
glam = { version = "0.34.3", features = ["bytemuck"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.35"
parking_lot = "0.13.0"
serde_json = "1.0.154"
web-time = "1"
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7.0.0"
env_logger = "0.11.11"
pollster = "1.0.1"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
ureq = "3.5.1"
tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
wgpu = "30"
egui-winit = { version = "0.37.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Request", "RequestInit", "RequestMode", "Response", "Headers", "Storage", "Location", "UrlSearchParams", "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode", "AudioNode", "AudioParam", "GainNode", "BaseAudioContext", "AudioContextState", "Performance", "console", "ScriptProcessorNode", "AudioProcessingEvent", "AudioContextOptions", "AudioScheduledSourceNode", "WebSocket", "BinaryType", "MessageEvent", "CloseEvent"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
naga = { version = "=30.0.1", features = ["wgsl-in"] }
